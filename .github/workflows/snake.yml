name: generate snake

on:
  schedule:
    - cron: "0 0 * * *"        # обновляться каждый день
  workflow_dispatch:           # ручной запуск из вкладки Actions
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Daniil1522-x
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?color_dark=#0d1117&color_snake=#7F52FF&color_dots_dark=#161b22

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}